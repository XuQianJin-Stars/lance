[package]
name = "goosefs-sdk"
version = "0.1.9"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "OpenDAL 0.59 still requires goosefs-sdk ^0.1.9. This crate reports that version so [patch.crates-io] matches, and re-exports Tencent goosefs-sdk 0.2.x from git main."

[dependencies]
goosefs-sdk-real = { package = "goosefs-sdk", git = "https://github.com/Tencent/tencent-goosefs-rust-sdk.git", branch = "main" }
